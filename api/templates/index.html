<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Поделить расходы в походе</title>
</head>
<body>
    <h1>Распределение расходов по дням</h1>

    <form method="POST">
        <label for="days">Сколько дней длился поход: </label>
        <input type="number" id="days" name="days" required><br><br>

        <h2>Введите количество участников по дням:</h2>
        {% for i in range(N) %}
            <label for="participant_{{ i }}">День {{ i + 1 }} (количество участников): </label>
            <input type="number" id="participant_{{ i }}" name="participant_{{ i }}" required><br><br>
        {% endfor %}

        <label for="total_sum">Введите общую сумму расходов: </label>
        <input type="number" id="total_sum" name="total_sum" step="0.01" required><br><br>

        <button type="submit">Рассчитать</button>
    </form>

    {% if result %}
        <h2>Результат:</h2>
        <ul>
            {% for entry in result %}
                <li>День {{ entry.day }}: {{ entry.amount }} рублей</li>
            {% endfor %}
        </ul>
    {% endif %}
</body>
</html>
